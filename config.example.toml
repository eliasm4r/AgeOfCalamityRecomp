# Copy to config.local.toml (ignored by git) and point it at YOUR files.
# Paths in WSL: /mnt/d/... or ~/...  (the dump can sit in 'Game Files/', ignored by git)

[input]
# Base game 1.0.0, title id 01002B00111A2000 (NSP or XCI)
base = '/mnt/d/Age of Calamity/Game Files/<base folder>/<file>.nsp'
# Update 1.3.0 (v327680), title id 01002B00111A2800
update = '/mnt/d/Age of Calamity/Game Files/<update folder>/<file>.nsp'
# DLCs (optional)
dlc = []   # list of DLC NSP paths (01002B00111A3001..3004)
# YOUR console's keys. The tools read the file; the values are never printed or copied.
keys = '/mnt/d/Age of Calamity/Game Files/prod.keys'

[work]
# Extraction, generated C and builds. Keep plenty of space (estimate: 60+ GB on the PC).
dir = 'build'

[deck]
# Finished folder that goes to the SD card
dist = 'dist/steamdeck'
