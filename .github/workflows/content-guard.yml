name: content-guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nothing of the game in the repository
        run: python3 tools/check_content.py --all
      - name: Tests without game data
        run: python3 -m unittest discover -s tests -v
